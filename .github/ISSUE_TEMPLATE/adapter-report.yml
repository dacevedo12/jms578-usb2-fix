name: Adapter report
description: Tell us whether the fix worked on your adapter (it helps others with the same one).
labels: [adapter-report]
body:
  - type: input
    id: usb-id
    attributes:
      label: USB ID and name
      description: e.g. `7825:a2a4 ULT-Best Best USB Device` (shown by `status`)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Fixed, the drive now works plugged in directly
        - The tool ran but the problem remains
        - The tool refused (please paste its message)
        - Something went wrong (please paste the output)
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `sudo jms578-usb2-fix status`
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and OS
      description: e.g. MacBook Air M3, macOS 26.1 / Raspberry Pi 4, Debian 12
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Where you bought it, photos of the board, how it failed before.
