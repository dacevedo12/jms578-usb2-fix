<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Why the adapter works through a hub but not directly</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#111">Why it works through a hub, but not plugged in directly</text>

  <g font-size="14">
    <!-- row 1 -->
    <text x="24" y="92" font-weight="700" fill="#111">Direct, USB 3</text>
    <rect x="200" y="68" width="150" height="40" rx="6" fill="#e8eefc" stroke="#2f5fd0"/>
    <text x="275" y="93" text-anchor="middle">Adapter</text>
    <path d="M350 88 q 20 -14 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 l 30 0" stroke="#d00000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="490" y="68" text-anchor="middle" fill="#b00000">noisy 5 Gb/s signal</text>
    <rect x="640" y="68" width="150" height="40" rx="6" fill="#eee" stroke="#555"/>
    <text x="715" y="93" text-anchor="middle">Computer</text>
    <text x="810" y="93" fill="#b00000" font-weight="700">✗ errors</text>

    <!-- row 2 -->
    <text x="24" y="172" font-weight="700" fill="#111">Through a hub</text>
    <rect x="200" y="148" width="150" height="40" rx="6" fill="#e8eefc" stroke="#2f5fd0"/>
    <text x="275" y="173" text-anchor="middle">Adapter</text>
    <path d="M350 168 q 12 -10 24 0 t 24 0 l 30 0" stroke="#d00000" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="430" y="148" width="130" height="40" rx="6" fill="#fff6e0" stroke="#b07d00"/>
    <text x="495" y="166" text-anchor="middle">Hub</text>
    <text x="495" y="182" text-anchor="middle" font-size="11" fill="#7a5600">re-times the signal</text>
    <line x1="560" y1="168" x2="636" y2="168" stroke="#1f7a3d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="640" y="148" width="150" height="40" rx="6" fill="#eee" stroke="#555"/>
    <text x="715" y="173" text-anchor="middle">Computer</text>
    <text x="810" y="173" fill="#1f7a3d" font-weight="700">✓ usually</text>

    <!-- row 3 -->
    <text x="24" y="252" font-weight="700" fill="#111">USB 2.0-only mode</text>
    <text x="24" y="270" font-size="12" fill="#555">(this tool)</text>
    <rect x="200" y="228" width="150" height="40" rx="6" fill="#e8eefc" stroke="#2f5fd0"/>
    <text x="275" y="253" text-anchor="middle">Adapter</text>
    <line x1="350" y1="248" x2="636" y2="248" stroke="#1f7a3d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="490" y="238" text-anchor="middle" fill="#1f7a3d">480 Mb/s on the D+/D− wires only</text>
    <rect x="640" y="228" width="150" height="40" rx="6" fill="#eee" stroke="#555"/>
    <text x="715" y="253" text-anchor="middle">Computer</text>
    <text x="810" y="253" fill="#1f7a3d" font-weight="700">✓ reliable</text>
  </g>
  <text x="24" y="312" font-size="12" fill="#555">A USB 3 hub has its own clock recovery and receiver equalization, so it can decode a marginal signal and send a clean copy on.</text>
</svg>
