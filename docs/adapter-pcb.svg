<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Why cheap JMS578 USB-SATA adapters fail over USB 3</title>
  <rect width="1000" height="720" fill="#ffffff"/>

  <text x="24" y="38" font-size="22" font-weight="700" fill="#111">Inside a typical cheap JMS578 USB-SATA adapter</text>
  <text x="24" y="62" font-size="14" fill="#555">The chip is fine. The USB 3 wires are the problem; the USB 2 wires, on the other side of the board, are not.</text>

  <!-- ===================== Panel A: chip side ===================== -->
  <text x="40" y="100" font-size="15" font-weight="700" fill="#111">Chip side</text>
  <rect x="40" y="112" width="430" height="28" rx="4" fill="#2f5fd0"/>
  <text x="255" y="131" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">SATA connector (to the drive)</text>
  <rect x="40" y="140" width="430" height="230" rx="6" fill="#1f7a3d" stroke="#155c2d" stroke-width="2"/>

  <rect x="290" y="168" width="112" height="108" rx="6" fill="#222"/>
  <text x="346" y="214" font-size="15" fill="#eee" text-anchor="middle" font-weight="700">JMS578</text>
  <text x="346" y="233" font-size="10.5" fill="#bbb" text-anchor="middle">USB 3 ⇄ SATA bridge</text>
  <text x="346" y="248" font-size="10.5" fill="#bbb" text-anchor="middle">(8051 + USB 2/3 PHYs)</text>

  <rect x="80" y="180" width="96" height="58" rx="4" fill="#222"/>
  <text x="128" y="204" font-size="12" fill="#eee" text-anchor="middle" font-weight="700">SPI flash</text>
  <text x="128" y="220" font-size="10" fill="#bbb" text-anchor="middle">firmware +</text>
  <text x="128" y="232" font-size="10" fill="#bbb" text-anchor="middle">config (NVRAM)</text>
  <line x1="176" y1="209" x2="290" y2="209" stroke="#c9b26b" stroke-width="2"/>

  <rect x="420" y="282" width="40" height="32" rx="4" fill="#888"/>
  <text x="440" y="302" font-size="9" fill="#111" text-anchor="middle">30 MHz</text>

  <!-- traces chip -> CN2 (the middle pad has no trace) -->
  <path d="M318 276 V292 H168 V336" stroke="#c9b26b" stroke-width="2" fill="none"/>
  <path d="M332 276 V302 H210 V336" stroke="#c9b26b" stroke-width="2" fill="none"/>
  <path d="M360 276 V308 H294 V336" stroke="#c9b26b" stroke-width="2" fill="none"/>
  <path d="M374 276 V318 H336 V336" stroke="#c9b26b" stroke-width="2" fill="none"/>

  <text x="118" y="352" font-size="12" fill="#e8f5e9" font-weight="700">CN2</text>
  <rect x="154" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="196" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="238" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="280" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="322" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <line x1="242" y1="340" x2="262" y2="354" stroke="#d00000" stroke-width="3"/>
  <line x1="262" y1="340" x2="242" y2="354" stroke="#d00000" stroke-width="3"/>

  <!-- loose USB 3 wires -->
  <path d="M168 358 C168 410 186 430 214 480" stroke="#1e66f5" stroke-width="4" fill="none"/>
  <path d="M210 358 C210 410 226 430 246 480" stroke="#f2c200" stroke-width="4" fill="none"/>
  <path d="M294 358 C294 410 288 430 284 480" stroke="#8a3ffc" stroke-width="4" fill="none"/>
  <path d="M336 358 C336 410 328 430 318 480" stroke="#ff7f11" stroke-width="4" fill="none"/>
  <rect x="190" y="480" width="150" height="34" rx="8" fill="#444"/>
  <text x="265" y="502" font-size="12" fill="#fff" text-anchor="middle">to the USB-C cable</text>

  <g font-size="11" fill="#333">
    <rect x="40" y="530" width="12" height="6" fill="#1e66f5"/><text x="58" y="537">SSRX− (blue)</text>
    <rect x="150" y="530" width="12" height="6" fill="#f2c200"/><text x="168" y="537">SSRX+ (yellow)</text>
    <rect x="270" y="530" width="12" height="6" fill="#bbb"/><text x="288" y="537">ground drain (empty)</text>
    <rect x="40" y="548" width="12" height="6" fill="#8a3ffc"/><text x="58" y="555">SSTX− (purple)</text>
    <rect x="150" y="548" width="12" height="6" fill="#ff7f11"/><text x="168" y="555">SSTX+ (orange)</text>
  </g>

  <!-- markers on panel A -->
  <circle cx="252" cy="384" r="12" fill="#d00000"/>
  <text x="252" y="389" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <circle cx="372" cy="430" r="12" fill="#d00000"/>
  <text x="372" y="435" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <line x1="360" y1="430" x2="334" y2="430" stroke="#d00000" stroke-width="1.5"/>

  <!-- ===================== Panel B: back side ===================== -->
  <text x="530" y="100" font-size="15" font-weight="700" fill="#111">Back side</text>
  <rect x="530" y="112" width="430" height="28" rx="4" fill="#2f5fd0"/>
  <text x="745" y="131" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">SATA connector (to the drive)</text>
  <rect x="530" y="140" width="430" height="230" rx="6" fill="#1f7a3d" stroke="#155c2d" stroke-width="2"/>
  <g fill="#c9b26b">
    <rect x="560" y="146" width="6" height="18"/><rect x="574" y="146" width="6" height="18"/><rect x="588" y="146" width="6" height="18"/>
    <rect x="602" y="146" width="6" height="18"/><rect x="616" y="146" width="6" height="18"/><rect x="630" y="146" width="6" height="18"/>
    <rect x="644" y="146" width="6" height="18"/>
    <rect x="690" y="146" width="6" height="18"/><rect x="704" y="146" width="6" height="18"/><rect x="718" y="146" width="6" height="18"/>
    <rect x="732" y="146" width="6" height="18"/><rect x="746" y="146" width="6" height="18"/><rect x="760" y="146" width="6" height="18"/>
    <rect x="774" y="146" width="6" height="18"/><rect x="788" y="146" width="6" height="18"/><rect x="802" y="146" width="6" height="18"/>
    <rect x="816" y="146" width="6" height="18"/><rect x="830" y="146" width="6" height="18"/><rect x="844" y="146" width="6" height="18"/>
    <rect x="858" y="146" width="6" height="18"/><rect x="872" y="146" width="6" height="18"/><rect x="886" y="146" width="6" height="18"/>
  </g>
  <g fill="#e6d9b8">
    <rect x="590" y="200" width="16" height="10" rx="2"/><rect x="614" y="200" width="16" height="10" rx="2"/>
    <rect x="590" y="220" width="16" height="10" rx="2"/><rect x="638" y="214" width="22" height="12" rx="2"/>
    <rect x="672" y="236" width="16" height="10" rx="2"/><rect x="696" y="236" width="16" height="10" rx="2"/>
    <rect x="760" y="246" width="26" height="14" rx="2"/>
  </g>
  <text x="566" y="300" font-size="15" fill="#e8f5e9" font-weight="700">HZ-01</text>

  <!-- USB 2 pads and wires -->
  <rect x="686" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="728" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="770" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <rect x="812" y="336" width="28" height="22" rx="3" fill="#d9d9d9"/>
  <path d="M700 358 C700 410 716 430 734 480" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M742 358 C742 410 752 430 760 480" stroke="#2e9e45" stroke-width="4" fill="none"/>
  <path d="M784 358 C784 410 784 430 786 480" stroke="#f4f4f4" stroke-width="6" fill="none"/>
  <path d="M784 358 C784 410 784 430 786 480" stroke="#9a9a9a" stroke-width="1" fill="none" stroke-dasharray="0"/>
  <path d="M826 358 C826 410 820 430 812 480" stroke="#e02020" stroke-width="4" fill="none"/>
  <rect x="696" y="480" width="150" height="34" rx="8" fill="#444"/>
  <text x="771" y="502" font-size="12" fill="#fff" text-anchor="middle">to the USB-C cable</text>

  <g font-size="11" fill="#333">
    <rect x="530" y="530" width="12" height="6" fill="#222"/><text x="548" y="537">GND</text>
    <rect x="600" y="530" width="12" height="6" fill="#2e9e45"/><text x="618" y="537">D+ (green)</text>
    <rect x="700" y="530" width="12" height="6" fill="#f4f4f4" stroke="#9a9a9a"/><text x="718" y="537">D− (white)</text>
    <rect x="800" y="530" width="12" height="6" fill="#e02020"/><text x="818" y="537">VBUS 5 V (red)</text>
  </g>

  <circle cx="872" cy="430" r="12" fill="#1f7a3d"/>
  <text x="872" y="435" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">3</text>
  <line x1="860" y1="430" x2="826" y2="430" stroke="#1f7a3d" stroke-width="1.5"/>

  <!-- ===================== Explanations ===================== -->
  <g font-size="13" fill="#111">
    <rect x="24" y="580" width="304" height="118" rx="6" fill="#fff4f4" stroke="#d00000"/>
    <circle cx="44" cy="603" r="11" fill="#d00000"/>
    <text x="44" y="608" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
    <text x="62" y="608" font-weight="700" fill="#b00000">Ground drain left empty</text>
    <text x="38" y="634">The USB 3 pairs have no shield or</text>
    <text x="38" y="652">ground return. This pad has no wire,</text>
    <text x="38" y="670">and no trace to the chip.</text>

    <rect x="348" y="580" width="304" height="118" rx="6" fill="#fff4f4" stroke="#d00000"/>
    <circle cx="368" cy="603" r="11" fill="#d00000"/>
    <text x="368" y="608" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
    <text x="386" y="608" font-weight="700" fill="#b00000">USB 3 pairs as loose wires</text>
    <text x="362" y="634">5 Gb/s needs shielded, length-matched</text>
    <text x="362" y="652">differential pairs. Loose, untwisted</text>
    <text x="362" y="670">ends cause the errors and disconnects.</text>

    <rect x="672" y="580" width="304" height="118" rx="6" fill="#f2fbf4" stroke="#1f7a3d"/>
    <circle cx="692" cy="603" r="11" fill="#1f7a3d"/>
    <text x="692" y="608" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
    <text x="710" y="608" font-weight="700" fill="#1f7a3d">USB 2 wires are separate</text>
    <text x="686" y="634">D+/D− at 480 Mb/s tolerate this</text>
    <text x="686" y="652">wiring. USB 2.0-only mode makes the</text>
    <text x="686" y="670">chip use only these, so it works.</text>
  </g>
</svg>
